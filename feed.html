<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>REDWIRE — Content Feed</title>
  <meta name="description"
    content="Browse and download premium video content from REDWIRE. Filter by category, search, and download in your preferred quality." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Bebas+Neue&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --red: #e63946;
      --red-glow: rgba(230, 57, 70, 0.25);
      --black: #080808;
      --surface: #111111;
      --surface2: #1a1a1a;
      --surface3: #222222;
      --border: rgba(255, 255, 255, 0.07);
      --border2: rgba(255, 255, 255, 0.12);
      --text: #f0f0f0;
      --muted: #777;
      --muted2: #999;
      --white: #ffffff;
    }

    html,
    body {
      overflow-x: hidden;
      max-width: 100%;
      width: 100%;
      position: relative;
      scroll-behavior: smooth;
    }

    body {
      background: var(--black);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
    }

    /* NAV */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 60px ;
      background: rgba(8, 8, 8, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition: background .4s ease, border-color .4s ease, padding .3s ease;
      gap: 16px;
    }

    nav.scrolled {
      background: rgba(8, 8, 8, 0.95);
      border-bottom-color: var(--border);
      padding: 13px 60px;
    }

    .nav-toggle {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      padding: 6px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      flex-shrink: 0;
    }

    .nav-toggle span {
      display: block;
      width: 20px;
      height: 2px;
      background: var(--muted);
      border-radius: 2px;
      transition: all .3s;
    }

    .nav-toggle.open span:nth-child(1) {
      transform: translateY(7px) rotate(45deg);
      background: var(--red);
    }

    .nav-toggle.open span:nth-child(2) {
      opacity: 0;
    }

    .nav-toggle.open span:nth-child(3) {
      transform: translateY(-7px) rotate(-45deg);
      background: var(--red);
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .nav-logo-text {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      letter-spacing: 2px;
      color: var(--white);
    }

    .nav-logo-text span {
      color: var(--red);
    }

    .nav-right-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .hassan-nav-link {
      color: var(--red);
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      opacity: .85;
      letter-spacing: .5px;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      transition: all .2s;
    }

    .hassan-nav-link:hover {
      opacity: 1;
    }

    .nav-cta {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .mob-drawer {
      display: none;
    }

    .btn-ghost {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 9px 22px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all .2s;
      text-decoration: none;
    }

    .btn-ghost:hover {
      border-color: var(--red);
      color: var(--white);
    }

    .btn-primary {
      background: var(--red);
      color: #fff;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
      text-decoration: none;
    }

    .btn-primary:hover {
      background: #ff4757;
      transform: translateY(-1px);
      box-shadow: 0 6px 24px var(--red-glow);
    }

    .nav-search {
      display: flex;
      align-items: center;
      gap: 0;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 8px;
      overflow: hidden;
      width: 320px;
      max-width: 100%;
      flex: 1;
      min-width: 0;
    }

    .nav-search input {
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 14px;
      padding: 10px 14px;
      width: 100%;
      font-family: 'Inter', sans-serif;
    }

    .nav-search input::placeholder {
      color: var(--muted);
    }

    .nav-search-btn {
      background: none;
      border: none;
      padding: 10px 14px;
      color: var(--muted);
      cursor: pointer;
      transition: color .2s;
      flex-shrink: 0;
    }

    .nav-search-btn:hover {
      color: var(--red);
    }

    /* LAYOUT */
    .page-layout {
      display: flex;
      min-height: calc(100vh - 65px);
      margin-top: 65px;
    }

    /* FOOTER */
    footer {
      border-top: 1px solid var(--border);
      padding: 32px 40px;
      background: var(--black);
    }

    .footer-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .footer-left {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .footer-copy {
      font-size: 13px;
      color: var(--muted);
    }

    .footer-links {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .footer-links a {
      font-size: 12px;
      color: var(--muted);
      text-decoration: none;
      transition: color .2s;
    }

    .footer-links a:hover {
      color: var(--white);
    }

    .footer-credit {
      width: 100%;
      text-align: center;
      margin-top: 4px;
      color: var(--muted);
    }

    .footer-credit a {
      color: var(--red);
      text-decoration: none;
      font-weight: 600;
      transition: opacity .2s;
    }

    .footer-credit a:hover {
      opacity: .75;
    }

    /* SIDEBAR */
    .sidebar {
      width: 220px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      padding: 24px 0;
      position: sticky;
      top: 57px;
      height: calc(100vh - 57px);
      overflow-y: auto;
    }

    .sidebar::-webkit-scrollbar {
      width: 4px;
    }

    .sidebar::-webkit-scrollbar-track {
      background: transparent;
    }

    .sidebar::-webkit-scrollbar-thumb {
      background: var(--border2);
      border-radius: 2px;
    }

    .sidebar-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      padding: 0 20px;
      margin-bottom: 8px;
      margin-top: 20px;
    }

    .sidebar-label:first-child {
      margin-top: 0;
    }

    .cat-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: none;
      border: none;
      color: var(--muted2);
      padding: 10px 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      transition: all .15s;
      text-align: left;
    }

    .cat-btn:hover {
      color: var(--white);
      background: rgba(255, 255, 255, 0.04);
    }

    .cat-btn.active {
      color: var(--white);
      background: rgba(230, 57, 70, 0.1);
    }

    .cat-btn.active .cat-name {
      color: var(--red);
    }

    .cat-count {
      font-size: 10px;
      background: var(--surface2);
      color: var(--muted);
      padding: 2px 7px;
      border-radius: 10px;
      font-weight: 600;
    }

    .cat-btn.active .cat-count {
      background: rgba(230, 57, 70, 0.2);
      color: var(--red);
    }

    /* MAIN */
    .main-content {
      flex: 1;
      padding: 28px 32px;
      min-width: 0;
    }

    /* FILTER BAR */
    .filter-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      gap: 16px;
    }

    .filter-pills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pill {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted2);
      padding: 7px 16px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
      white-space: nowrap;
    }

    .pill:hover {
      border-color: var(--border2);
      color: var(--white);
    }

    .pill.active {
      background: var(--red);
      border-color: var(--red);
      color: #fff;
    }

    .sort-select {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted2);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      outline: none;
    }

    .sort-select:focus {
      border-color: var(--red);
    }

    .results-count {
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
    }

    .results-count span {
      color: var(--white);
      font-weight: 600;
    }

    /* GRID */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    /* VIDEO CARD */
    .video-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: all .25s;
      position: relative;
    }

    .video-card:hover {
      border-color: rgba(230, 57, 70, 0.3);
      transform: translateY(-3px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
    }

    .video-thumb {
      position: relative;
      aspect-ratio: 16/9;
      overflow: hidden;
    }

    .video-thumb-bg {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .4s;
    }

    .video-card:hover .video-thumb-bg {
      transform: scale(1.04);
    }

    .thumb-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.7) 0%, transparent 50%);
      transition: opacity .3s;
    }

    .play-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      width: 48px;
      height: 48px;
      background: rgba(230, 57, 70, 0.9);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: all .3s;
    }

    .video-card:hover .play-btn {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .thumb-duration {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 4px;
    }

    .thumb-category {
      position: absolute;
      top: 10px;
      left: 10px;
      background: var(--red);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: .5px;
      text-transform: uppercase;
    }

    .thumb-exclusive {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 215, 0, 0.5);
      color: #ffd700;
      font-size: 9px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: .5px;
    }

    .card-body {
      padding: 16px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      color: var(--muted);
    }

    .card-date {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .card-tags {
      display: flex;
      gap: 5px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .tag {
      background: var(--surface2);
      color: var(--muted2);
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 500;
    }

    .card-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-res-tags {
      display: flex;
      gap: 5px;
    }

    .res-tag {
      background: rgba(230, 57, 70, 0.1);
      border: 1px solid rgba(230, 57, 70, 0.2);
      color: var(--red);
      font-size: 9px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 3px;
    }

    .card-dl-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      background: none;
      border: 1px solid var(--border);
      color: var(--muted2);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
      font-family: 'Inter', sans-serif;
    }

    .card-dl-btn:hover {
      border-color: var(--red);
      color: var(--red);
    }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      backdrop-filter: blur(6px);
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 16px;
      width: 100%;
      max-width: 920px;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }

    .modal::-webkit-scrollbar {
      width: 4px;
    }

    .modal::-webkit-scrollbar-thumb {
      background: var(--border2);
      border-radius: 2px;
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted2);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all .2s;
      z-index: 10;
    }

    .modal-close:hover {
      border-color: var(--red);
      color: var(--red);
    }

    .modal-player {
      position: relative;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: 12px 12px 0 0;
      overflow: hidden;
    }

    .modal-player-bg {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .player-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.4);
    }

    .player-play {
      width: 72px;
      height: 72px;
      background: var(--red);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all .25s;
      box-shadow: 0 0 40px rgba(230, 57, 70, 0.5);
    }

    .player-play:hover {
      transform: scale(1.1);
      box-shadow: 0 0 60px rgba(230, 57, 70, 0.7);
    }

    .player-wm {
      position: absolute;
      top: 16px;
      right: 16px;
      font-size: 11px;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 2px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 4px 10px;
      border-radius: 4px;
    }

    .player-progress {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 8px 16px 12px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent);
    }

    .progress-bar {
      height: 3px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      cursor: pointer;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      background: var(--red);
      border-radius: 2px;
      width: 35%;
    }

    .progress-time {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.6);
    }

    .modal-body {
      padding: 24px 28px;
    }

    .modal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 800;
      line-height: 1.3;
      flex: 1;
    }

    .modal-category {
      background: var(--red);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 4px;
      letter-spacing: .5px;
      text-transform: uppercase;
      white-space: nowrap;
      align-self: flex-start;
      margin-top: 4px;
    }

    .modal-meta-row {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
    }

    .meta-item strong {
      color: var(--muted2);
    }

    .meta-sep {
      width: 4px;
      height: 4px;
      background: var(--border2);
      border-radius: 50%;
    }

    .modal-section-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .modal-desc {
      font-size: 14px;
      color: var(--muted2);
      line-height: 1.8;
      margin-bottom: 24px;
    }

    /* TIMESTAMPS */
    .timestamps {
      display: flex;
      flex-direction: column;
      gap: 0;
      margin-bottom: 24px;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .ts-item {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      transition: background .15s;
      cursor: pointer;
    }

    .ts-item:last-child {
      border-bottom: none;
    }

    .ts-item:hover {
      background: var(--surface2);
    }

    .ts-time {
      background: rgba(230, 57, 70, 0.15);
      border: 1px solid rgba(230, 57, 70, 0.25);
      color: var(--red);
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 5px;
      white-space: nowrap;
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 1px;
      flex-shrink: 0;
      transition: all .2s;
    }

    .ts-item:hover .ts-time {
      background: var(--red);
      color: #fff;
    }

    .ts-desc {
      font-size: 13px;
      color: var(--muted2);
      line-height: 1.5;
    }

    /* TAGS */
    .modal-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .modal-tag {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted2);
      font-size: 11px;
      padding: 4px 12px;
      border-radius: 100px;
    }

    /* DOWNLOAD */
    .dl-section {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }

    .dl-title {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dl-title svg {
      color: var(--red);
    }

    .dl-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    .dl-group label {
      display: block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .dl-options {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .dl-opt {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted2);
      padding: 7px 14px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
    }

    .dl-opt:hover {
      border-color: var(--border2);
      color: var(--white);
    }

      if (activeFormat === 'exclusive') result = result.filter(v => v.exclusive);
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        result = result.filter(v => v.title.toLowerCase().includes(q) || v.desc.toLowerCase().includes(q) || v.tags.some(t => t.toLowerCase().includes(q)));
      }
      if (sortOrder === 'latest') result.sort((a, b) => new Date(b.date) - new Date(a.date));
      if (sortOrder === 'oldest') result.sort((a, b) => new Date(a.date) - new Date(b.date));
      if (sortOrder === 'az') result.sort((a, b) => a.title.localeCompare(b.title));
      return result;

    }
    function closeModalOutside(e) {
      if (e.target === document.getElementById('modal')) closeModal();
    }

    function seekTo(timeStr) {
      document.getElementById('current-time').textContent = timeStr;
      const parts = timeStr.split(':');
      const secs = parseInt(parts[0]) * 60 + parseInt(parts[1]);
      const total = currentVideo ? parseDuration(currentVideo.duration) : 600;
      const pct = Math.min(100, (secs / total) * 100);
      document.getElementById('progress-fill').style.width = pct + '%';
    }

    function parseDuration(d) {
      const p = d.split(':'); return parseInt(p[0]) * 60 + parseInt(p[1]);
    }

    function seekVideo(e) {
      const bar = e.currentTarget;
      const rect = bar.getBoundingClientRect();
      const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      document.getElementById('progress-fill').style.width = (pct * 100) + '%';
      if (currentVideo) {
        const secs = Math.floor(pct * parseDuration(currentVideo.duration));
        const m = Math.floor(secs / 60), s = secs % 60;
        document.getElementById('current-time').textContent = m + ':' + (s < 10 ? '0' : '') + s;
      }
    }

    function togglePlay() {
      const icon = document.getElementById('play-icon');
      const isPlaying = icon.getAttribute('data-playing') === '1';
      if (!isPlaying) {
        icon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
        icon.setAttribute('data-playing', '1');
      } else {
        icon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
        icon.setAttribute('data-playing', '0');
      }
    }

    function selectRes(r, btn) {
      selectedRes = r;
      document.querySelectorAll('#res-opts .dl-opt').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      updateSize();
    }
    function selectAspect(a, btn) {
      selectedAspect = a;
      document.querySelectorAll('#aspect-opts .dl-opt').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      updateSize();
    }
    function selectFmt(btn) {
      btn.closest('.dl-options').querySelectorAll('.dl-opt').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    }
    function toggleWatermark(el) {
      watermarkOn = el.checked;
      document.getElementById('player-wm').style.display = watermarkOn ? 'block' : 'none';
    }
    function getEstimatedSize() {
      const sizes = { '4K': { '16:9': '4.2 GB', '9:16': '4.5 GB', '1:1': '3.8 GB', '4:3': '4.0 GB' }, '1080p': { '16:9': '1.1 GB', '9:16': '1.2 GB', '1:1': '980 MB', '4:3': '1.05 GB' }, '720p': { '16:9': '480 MB', '9:16': '510 MB', '1:1': '420 MB', '4:3': '460 MB' } };
      return (sizes[selectedRes]?.[selectedAspect]) || '1.1 GB';
    }
    function updateSize() {
      const el = document.getElementById('dl-filesize');
      if (el) el.textContent = 'Estimated size: ~' + getEstimatedSize();
    }
    function downloadVideo() {
      const btn = document.querySelector('.dl-main-btn');
      btn.textContent = '⏳ Preparing download...';
      btn.style.opacity = '0.7';
      setTimeout(() => {
        btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Ready! Download started`;
        btn.style.background = '#16a34a';
        btn.style.opacity = '1';
        setTimeout(() => {
          btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Download File`;
          btn.style.background = '';
        }, 3000);
      }, 1500);
    }

    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    // Nav: transparent → frosted glass on scroll
    const navEl = document.getElementById('main-nav');
    function handleNavScroll() {
      if (navEl) navEl.classList.toggle('scrolled', window.scrollY > 40);
    }
    window.addEventListener('scroll', handleNavScroll, { passive: true });
    handleNavScroll();

    // Hamburger toggle
    const toggle = document.getElementById('nav-toggle');
    const drawer = document.getElementById('mob-drawer');

    function closeDrawer() {
      if (toggle && drawer) {
        toggle.classList.remove('open');
        drawer.classList.remove('open');
        toggle.setAttribute('aria-expanded', 'false');
      }
    }

    if (toggle && drawer) {
      toggle.addEventListener('click', () => {
        const isOpen = toggle.classList.toggle('open');
        drawer.classList.toggle('open', isOpen);
        toggle.setAttribute('aria-expanded', String(isOpen));
      });
      document.addEventListener('click', e => {
        if (!e.target.closest('nav')) closeDrawer();
      });
    }

    renderCards();
  </script>
</body>

</html>
